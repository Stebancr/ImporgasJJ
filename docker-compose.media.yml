# ================================================================
# SERVICIO DE MEDIA — incluido también en docker-compose.data.yml
# Solo usar este archivo si se levanta media de forma aislada
# ================================================================

services:

  media:
    image: nginx:alpine
    container_name: media
    restart: unless-stopped
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
      - ./nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    networks:
      - shared_net

volumes:
  media_data:
    external: true

networks:
  shared_net:
    external: true