name: imporgas-ci
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: imporgas_ci
      POSTGRES_USER: imporgas_ci
      POSTGRES_PASSWORD: ci-only-not-production
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U imporgas_ci']
      interval: 2s
      retries: 30
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ci-only-not-a-production-key
      DEBUG: 'True'
      ALLOWED_HOSTS: '*'
      EXTERNAL_PRODUCT_URL_TEMPLATE: https://www.imporgasjj.com/producto/{id}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: imporgas_ci
      DB_USER: imporgas_ci
      DB_PASSWORD: ci-only-not-production
      DB_HOST: database
      CHANNEL_REDIS_URL: redis://redis:6379/2
      CRM_TEST_POSTGRES: '1'
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      TRANSACTIONAL_EMAIL_ENABLED: 'False'
      TCC_SHIPPING_ENABLED: 'False'
      TCC_API_ENVIRONMENT: sandbox
      TCC_DISPATCH_ENABLED: 'False'
      TCC_PRODUCTION_APPROVED: 'False'
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
