events {}

http {
    log_format safe_access '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe_access;
    # Docker DNS re-resolves service IPs after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend_dev { zone backend_dev 64k; server backend:8000 resolve; }
    upstream frontend_dev { zone frontend_dev 64k; server frontend-ecommerce:3000 resolve; }
    upstream media_dev { zone media_dev 64k; server media:80 resolve; }
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # frontend_U es la única aplicación React; los puertos 80 y 81 se
    # conservan durante la transición, ambos sirven exactamente la misma app.
    server {
        listen 80;
        listen 81;
        server_name localhost;

        client_max_body_size 25M;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 60s;
        limit_conn per_ip 30;

        location = /api/auth/token/ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://backend_dev/auth/token/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /api/internal/ {
            return 404;
        }

        location /whatsapp-gateway/socket.io/ {
            proxy_pass http://whatsapp-gateway:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 75s;
        }

        # Meta puede entregar lotes y reintentos; tiene un límite separado del
        # API general y Django aún valida firma, tamaño e idempotencia.
        location /api/meta/ {
            # Nginx incluye la query completa en errores de upstream; Meta
            # transmite el verify token allí. Daphne conserva el diagnóstico.
            error_log /var/log/nginx/meta-upstream-error.log crit;
            limit_req zone=meta_webhook burst=60 nodelay;
            client_max_body_size 2M;
            proxy_pass http://backend_dev/meta/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
        }

        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://backend_dev/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
        }

        location /ws/ {
            proxy_pass http://backend_dev/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }

        location /static/ {
            proxy_pass http://backend_dev/static/;
        }

        location /media/ {
            proxy_pass http://media_dev/media/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
