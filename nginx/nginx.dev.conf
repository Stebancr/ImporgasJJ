events {}

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # frontend_U es la única aplicación React; los puertos 80 y 81 se
    # conservan durante la transición, ambos sirven exactamente la misma app.
    server {
        listen 80;
        listen 81;
        server_name localhost;

        client_max_body_size 25M;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 60s;
        limit_conn per_ip 30;

        location = /api/auth/token/ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://backend:8000/auth/token/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
        }

        location /static/ {
            proxy_pass http://backend:8000/static/;
        }

        location /media/ {
            proxy_pass http://media:80/media/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend-ecommerce:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
