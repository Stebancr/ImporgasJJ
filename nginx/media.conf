server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location ^~ /media/crm_chat/ {
        return 404;
    }
    location ^~ /media/visitas_pdf/ {
        return 404;
    }
    location ^~ /media/evidencias/ { return 404; }
    location ^~ /media/evidencias_temporales/ { return 404; }
    location ^~ /media/firmas/ { return 404; }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404;
    }
}
