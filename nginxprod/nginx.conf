user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Solo el proxy de la red Coolify puede declarar una conexion HTTPS.
    # El puerto publico :81 ignora X-Forwarded-Proto enviado por clientes.
    geo $trusted_coolify_proxy {
        default 0;
        172.16.1.0/24 1;
    }

    map "$trusted_coolify_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1:https" https;
    }

    upstream backend_upstream {
        server backend:8001;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    upstream media_upstream {
        server media:80;
        keepalive 8;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name imporgasjj.com www.imporgasjj.com djsolutions.io www.djsolutions.io *.djsolutions.io 2.25.225.216;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=3600" always;

        limit_conn per_ip 30;

        location = /nginx-health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location = /api/auth/token/ {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://backend_upstream/auth/token/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location ^~ /api/meta/ {
            limit_req zone=webhooks burst=60 nodelay;
            proxy_pass http://backend_upstream/meta/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/webhooks/wompi {
            limit_req zone=webhooks burst=60 nodelay;
            proxy_pass http://backend_upstream/webhooks/wompi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://backend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        location /ws/ {
            proxy_pass http://backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }

        location /media/ {
            proxy_pass http://media_upstream/media/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
