server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /media/crm_chat/ {
        return 404;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
