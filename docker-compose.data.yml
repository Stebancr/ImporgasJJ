# ================================================================
# SERVICIOS PERSISTENTES — No hacer rebuild sin respaldo previo
# Levantar con: docker compose -f docker-compose.data.yml up -d
# ================================================================

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: imporgas_db
      POSTGRES_USER: ImporgasJJ
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ImporgasJJ"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared_net

  media:
    image: nginx:alpine
    container_name: media
    restart: unless-stopped
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
      - ./nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - shared_net

volumes:
  postgres_data:
  media_data:

networks:
  shared_net:
    driver: bridge
