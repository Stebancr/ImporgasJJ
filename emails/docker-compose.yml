# ================================================================
# SERVIDOR DE CORREO SMTP (Postfix relay → Gmail)
# Levantar con: docker compose -f emails/docker-compose.yml up -d
# (ejecutar desde la raíz del proyecto)
# ================================================================

services:

  smtp:
    image: boky/postfix
    container_name: smtp_server
    restart: unless-stopped
    dns:
      - 8.8.8.8 
      - 8.8.4.4
    ports:
      - "2525:587"
    environment:
      - HOSTNAME=${EMAIL_SMTP_HOSTNAME:-mail.gasstore.com}
      - RELAYHOST=${EMAIL_RELAY_HOST:-smtp-relay.brevo.com:587}
      - RELAYHOST_USERNAME=${EMAIL_HOST_USER}
      - RELAYHOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - ALLOWED_SENDER_DOMAINS=${EMAIL_ALLOWED_SENDER_DOMAINS:-gmail.com gasstore.com}
      # ── Para volver a Gmail cuando las credenciales funcionen: ──
      # - RELAYHOST=smtp.gmail.com:587
      # - RELAYHOST_USERNAME=luisstbean999@gmail.com
      # - RELAYHOST_PASSWORD=TU_APP_PASSWORD_GMAIL
    volumes:
      - smtp_logs:/var/log
    networks:
      - shared_net

volumes:
  smtp_logs:

networks:
  shared_net:
    external: true
    name: frontend_shared_net
