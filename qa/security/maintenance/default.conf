server {
 listen 80;
 listen 8001;
 listen 3001;
 server_name _;
 location = /health {
  default_type application/json;
  return 200 '{"status":"maintenance","authentication":"disabled"}';
 }
 location / {
  default_type text/html;
  add_header Retry-After 300 always;
  add_header Cache-Control no-store always;
  return 503 '<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Mantenimiento | ImporGas JJ</title><main style="font:18px system-ui;max-width:36rem;margin:15vh auto;padding:24px"><h1>ImporGas JJ</h1><p>Estamos realizando un mantenimiento de seguridad.</p><p>Intenta ingresar nuevamente en unos minutos. Tus datos se conservan.</p></main></html>';
 }
}
