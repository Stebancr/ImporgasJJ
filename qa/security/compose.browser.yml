services:
  backend:
    command: daphne --access-log /dev/null -b 0.0.0.0 -p 8001 core.asgi:application
    environment:
      CRM_INTERNAL_SERVICE_TOKEN: ${SECURITY_QA_SERVICE_TOKEN:?synthetic test credential required}
  gateway:
    image: node:22
    working_dir: /work
    command: sh -c 'cp -a /source/. /work/ && npm ci >/tmp/install.log 2>&1 && npm run build >/tmp/build.log 2>&1 && node /qa/gateway-harness.mjs'
    environment:
      CRM_INTERNAL_SERVICE_TOKEN: ${SECURITY_QA_SERVICE_TOKEN:?synthetic test credential required}
      CRM_API_URL: http://backend:8001
      WHATSAPP_GATEWAY_ENV: test
    volumes:
      - ../../whatsapp-gateway:/source:ro
      - .:/qa:ro
    networks: [default, install]
  frontend:
    image: node:20
    working_dir: /work
    command: sh -c 'cp -a /source/. /work/ && npm ci --legacy-peer-deps >/tmp/install.log 2>&1 && npm run build >/tmp/build.log 2>&1 && npm run preview -- --host 0.0.0.0 --port 4173'
    volumes:
      - ../../frontend_U:/source:ro
    networks: [default, install]
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend, gateway]
networks:
  install: {}
