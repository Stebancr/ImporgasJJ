server {
 listen 80;
 server_name localhost;
 location /api/ { proxy_pass http://backend:8001/; proxy_set_header Host localhost; }
 location /ws/ { proxy_pass http://backend:8001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host localhost; }
 location /whatsapp-gateway/ { proxy_pass http://gateway:3001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 location / { proxy_pass http://frontend:4173; proxy_set_header Host localhost; }
}
