# ================================================================
# SERVICIOS DE DESARROLLO — Seguro hacer rebuild
# Requisito previo: docker compose -f docker-compose.data.yml up -d
# Levantar con:     docker compose -f docker-compose.dev.yml up -d
# ================================================================

services:

  backend:
    build: ./BACKEND
    container_name: backend
    restart: on-failure
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./BACKEND:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://ollama:11434/api/chat}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      # Relay definido en emails/docker-compose.yml; se respeta EMAIL_* si
      # el despliegue aporta credenciales o un proveedor SMTP distinto.
      - EMAIL_HOST=${EMAIL_HOST:-smtp}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@gasstore.com}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - shared_net
      - email_net

  frontend-ecommerce:
    image: node:20
    container_name: frontend-ecommerce
    working_dir: /app
    volumes:
      - ./frontend_U:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    command: sh -c "npm install && npm run dev"
    networks:
      - shared_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "81:81"
    depends_on:
      - backend
      - frontend-ecommerce
    networks:
      - shared_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Mailpit — captura correos en desarrollo (no envía real)
  # Web UI: http://localhost:8025
  # SMTP interno en: mailpit:1025
  # ─────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI para ver correos
      - "1025:1025"   # SMTP (usa este en Django: EMAIL_HOST=mailpit, EMAIL_PORT=1025)
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - shared_net

  # ─────────────────────────────────────────────────────────
  # Ollama — Servicio de IA para chatbot
  # API interna: http://ollama:11434
  # ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  media_data:
    external: true
  ollama_data:

networks:
  shared_net:
    external: true
  # Red externa utilizada por emails/docker-compose.yml (smtp_server).
  email_net:
    external: true
    name: frontend_shared_net
