# ================================================================
# SERVICIOS DE DESARROLLO — Seguro hacer rebuild
# Requisito previo: docker compose -f docker-compose.data.yml up -d
# Levantar con:     docker compose -f docker-compose.dev.yml up -d
# ================================================================

services:

  backend:
    build: ./BACKEND
    container_name: backend
    restart: on-failure
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./BACKEND:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=imporgas_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - WOMPI_PUBLIC_KEY=pub_test_wrhmXXJLZGHgUIqSsdRDhn5XsENolPk6
      - WOMPI_PRIVATE_KEY=prv_test_xi7ZmMOPdRk6wyGwMfOZnYF9jQlRP1c8
      - WOMPI_EVENTS_SECRET=test_events_awOMG60UQtg88tAqskRnj1bvzC3eyjjM
      - WOMPI_INTEGRITY_SECRET=test_integrity_LUyppEoIInrObgtyuuuyQXsdzVOmCTD1
    ports:
      - "8000:8000"
    networks:
      - shared_net

  frontend-ecommerce:
    image: node:20
    container_name: frontend-ecommerce
    working_dir: /app
    volumes:
      - ./frontend_U:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    command: sh -c "npm install && npm run dev"
    networks:
      - shared_net

  frontend-software:
    image: node:22
    container_name: frontend-software
    working_dir: /app
    volumes:
      - ./frontend_S:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    networks:
      - shared_net



  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "81:81"
    depends_on:
      - backend
      - frontend-software
      - frontend-ecommerce
    networks:
      - shared_net

  # ─────────────────────────────────────────────────────────
  # Mailpit — captura correos en desarrollo (no envía real)
  # Web UI: http://localhost:8025
  # SMTP interno en: mailpit:1025
  # ─────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI para ver correos
      - "1025:1025"   # SMTP (usa este en Django: EMAIL_HOST=mailpit, EMAIL_PORT=1025)
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - shared_net

  # ─────────────────────────────────────────────────────────
  # Ollama — Servicio de IA para chatbot
  # API interna: http://ollama:11434
  # ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Comando para auto-descargar el modelo al iniciar (solo si no existe)
    command: >
      sh -c "ollama serve &
      sleep 5 &&
      ollama list | grep -q qwen2.5:1.5b || ollama pull qwen2.5:1.5b &&
      wait"

volumes:
  media_data:
    external: true
  ollama_data:

networks:
  shared_net:
    external: true
