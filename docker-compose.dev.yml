# ================================================================
# SERVICIOS DE DESARROLLO — Seguro hacer rebuild
# Requisito previo: docker compose -f docker-compose.data.yml up -d
# Levantar con:     docker compose -f docker-compose.dev.yml up -d
# ================================================================

services:

  backend:
    build: ./BACKEND
    container_name: backend
    restart: on-failure
    command: sh -c "python manage.py migrate --noinput && daphne --access-log /dev/null -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./BACKEND:/app
      - media_data:/app/media
    env_file:
      - path: .envdev
        format: raw
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CHANNEL_REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - WOMPI_API_URL=https://sandbox.wompi.co/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen:4b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_QUEUE_WAIT=${OLLAMA_QUEUE_WAIT:-20}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost}
      - PRODUCT_URL_TEMPLATE=${PRODUCT_URL_TEMPLATE:-http://localhost/producto/{id}}
      - EXTERNAL_PRODUCT_URL_TEMPLATE=${EXTERNAL_PRODUCT_URL_TEMPLATE:-https://www.imporgasjj.com/producto/{id}}
      # Relay definido en emails/docker-compose.yml; se respeta EMAIL_* si
      # el despliegue aporta credenciales o un proveedor SMTP distinto.
      - EMAIL_HOST=${EMAIL_HOST:-smtp}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@IMPORGASJJ.com}
    depends_on:
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - shared_net
      - email_net

  celery-worker:
    build: ./BACKEND
    container_name: celery-worker
    restart: on-failure
    command: celery -A core worker --loglevel=INFO --concurrency=2
    volumes:
      - ./BACKEND:/app
      - media_data:/app/media
    env_file:
      - path: .envdev
        format: raw
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CHANNEL_REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - WOMPI_API_URL=https://sandbox.wompi.co/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen:4b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_QUEUE_WAIT=${OLLAMA_QUEUE_WAIT:-20}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost}
      - PRODUCT_URL_TEMPLATE=${PRODUCT_URL_TEMPLATE:-http://localhost/producto/{id}}
      - EXTERNAL_PRODUCT_URL_TEMPLATE=${EXTERNAL_PRODUCT_URL_TEMPLATE:-https://www.imporgasjj.com/producto/{id}}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - shared_net
      - email_net

  celery-beat:
    build: ./BACKEND
    container_name: celery-beat
    restart: on-failure
    command: celery -A core beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./BACKEND:/app
    env_file:
      - path: .envdev
        format: raw
    environment:
      - REDIS_URL=redis://redis:6379/1
      - CHANNEL_REDIS_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - shared_net

  frontend-ecommerce:
    image: node:20
    container_name: frontend-ecommerce
    working_dir: /app
    volumes:
      - ./frontend_U:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL:-http://localhost}
    command: sh -c "npm install && npm run dev"
    networks:
      - shared_net

  whatsapp-gateway:
    build: ./whatsapp-gateway
    container_name: whatsapp-gateway
    restart: unless-stopped
    env_file:
      - path: .envdev
        format: raw
    environment:
      - WHATSAPP_GATEWAY_ENV=development
      - WHATSAPP_GATEWAY_PORT=3001
      - CRM_API_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/1
      - WHATSAPP_AUTH_DIR=/app/auth
      - WHATSAPP_MEDIA_DIR=/app/media
    volumes:
      - whatsapp_auth_dev:/app/auth
      - whatsapp_media_dev:/app/media
    depends_on:
      - backend
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared_net

  whatsapp-gateway-test:
    profiles: ["test"]
    build:
      context: ./whatsapp-gateway
      target: build
    env_file:
      - path: .envdev
        format: raw
    environment:
      - WHATSAPP_GATEWAY_ENV=test
      - CRM_API_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/1
      - WHATSAPP_AUTH_DIR=/tmp/whatsapp-auth
      - WHATSAPP_MEDIA_DIR=/tmp/whatsapp-media
    command: npm test
    networks:
      - shared_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:81:81"
    depends_on:
      backend:
        condition: service_started
      frontend-ecommerce:
        condition: service_started
      whatsapp-gateway:
        condition: service_healthy
    networks:
      - shared_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Mailpit — captura correos en desarrollo (no envía real)
  # Web UI: http://localhost:8025
  # SMTP interno en: mailpit:1025
  # ─────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # Web UI para ver correos
      - "127.0.0.1:1025:1025"   # SMTP (usa este en Django: EMAIL_HOST=mailpit, EMAIL_PORT=1025)
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - shared_net

  # ─────────────────────────────────────────────────────────
  # Ollama — Servicio de IA para chatbot
  # API interna: http://ollama:11434
  # ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - shared_net

volumes:
  media_data:
    external: true
  ollama_data:
  whatsapp_auth_dev:
  whatsapp_media_dev:

networks:
  shared_net:
    external: true
  # Red externa utilizada por emails/docker-compose.yml (smtp_server).
  email_net:
    external: true
    name: frontend_shared_net
